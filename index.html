<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>The Sandlot — Look Through the Looking Glass</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@400;700&display=swap');
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    background: #050505;
    color: #e8e0d5;
    font-family: 'Inter', system-ui, sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    cursor: none;
  }
  
  #canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
  }
  
  #ui {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  
  .looking-glass {
    width: min(70vw, 420px);
    height: min(70vw, 420px);
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(180,200,220,0.15), rgba(20,25,35,0.9) 70%);
    border: 1px solid rgba(180,190,210,0.25);
    box-shadow: 
      0 0 80px rgba(100,140,180,0.15),
      inset 0 0 60px rgba(0,0,0,0.6);
    position: relative;
    pointer-events: auto;
    cursor: pointer;
    transition: all 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    overflow: hidden;
  }
  
  .looking-glass::before {
    content: '';
    position: absolute;
    inset: 8%;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(255,255,255,0.08), transparent 50%);
    pointer-events: none;
  }
  
  .looking-glass.active {
    transform: scale(1.8);
    opacity: 0;
    border-color: transparent;
  }
  
  #status {
    position: absolute;
    bottom: 12%;
    text-align: center;
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(200,190,170,0.5);
    opacity: 0;
    transition: opacity 1.5s ease;
  }
  
  #status.visible { opacity: 1; }
  
  #sequence {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    max-width: 90vw;
    pointer-events: none;
  }
  
  .line {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.4rem, 4vw, 2.6rem);
    line-height: 1.3;
    opacity: 0;
    transform: translateY(20px);
    transition: all 1.8s cubic-bezier(0.2, 0.8, 0.2, 1);
    margin: 0.6em 0;
    text-shadow: 0 0 40px rgba(0,0,0,0.8);
  }
  
  .line.visible {
    opacity: 1;
    transform: translateY(0);
  }
  
  .line.core {
    font-size: clamp(1.1rem, 3.2vw, 1.9rem);
    font-weight: 400;
    color: #d4c4a8;
    max-width: 28em;
    margin: 1.5em auto;
  }
  
  .line.small {
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(180,170,150,0.6);
  }
  
  #hint {
    position: absolute;
    bottom: 8%;
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(160,150,130,0.35);
    opacity: 1;
    transition: opacity 2s ease;
  }
  
  #hint.hidden { opacity: 0; }
  
  .cursor-dot {
    position: fixed;
    width: 8px;
    height: 8px;
    background: rgba(220,200,160,0.7);
    border-radius: 50%;
    pointer-events: none;
    z-index: 100;
    transform: translate(-50%, -50%);
    transition: width 0.2s, height 0.2s, background 0.2s;
  }
</style>
</head>
<body>
  <canvas id="canvas"></canvas>
  
  <div id="ui">
    <div class="looking-glass" id="glass"></div>
    <div id="status">THE SANDLOT</div>
    <div id="sequence"></div>
    <div id="hint">LOOK THROUGH THE GLASS</div>
  </div>
  
  <div class="cursor-dot" id="cursor"></div>

<script>
/* ============================================================
   THE SANDLOT — Looking Glass Entry
   Pure childhood. Before the walls.
   Every person is the master of their own reality.
   They just have to remember.
   ============================================================ */

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const glass = document.getElementById('glass');
const status = document.getElementById('status');
const sequence = document.getElementById('sequence');
const hint = document.getElementById('hint');
const cursor = document.getElementById('cursor');

let width, height, centerX, centerY;
let audioCtx, masterGain, binauralLeft, binauralRight, delayNode, padGain;
let started = false;
let time = 0;
let particles = [];
let spirals = [];

const PHI = 1.618033988749895;

function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  centerX = width / 2;
  centerY = height / 2;
}

window.addEventListener('resize', resize);
resize();

// Custom cursor
document.addEventListener('mousemove', e => {
  cursor.style.left = e.clientX + 'px';
  cursor.style.top = e.clientY + 'px';
});

// ============================================================
// AUDIO ENGINE — 42 Hz binaural + 3ms IATD + A420 atmosphere
// ============================================================

function initAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0;
  masterGain.connect(audioCtx.destination);

  // --- 42 Hz Binaural with 3ms interaural time difference ---
  const carrier = 98; // low body-feeling pad
  binauralLeft = audioCtx.createOscillator();
  binauralRight = audioCtx.createOscillator();
  binauralLeft.type = 'sine';
  binauralRight.type = 'sine';
  binauralLeft.frequency.value = carrier;
  binauralRight.frequency.value = carrier + 42; // exact 42 Hz difference

  const leftGain = audioCtx.createGain();
  const rightGain = audioCtx.createGain();
  leftGain.gain.value = 0.22;
  rightGain.gain.value = 0.22;

  delayNode = audioCtx.createDelay(0.1);
  delayNode.delayTime.value = 0.003; // 3 ms

  const merger = audioCtx.createChannelMerger(2);

  binauralLeft.connect(leftGain);
  leftGain.connect(merger, 0, 0);

  binauralRight.connect(delayNode);
  delayNode.connect(rightGain);
  rightGain.connect(merger, 0, 1);

  // --- Deep A420-referenced atmosphere (heavy low energy) ---
  // A420 means A4 = 420 Hz instead of 440 → scale factor 420/440 ≈ 0.9545
  const scale = 420 / 440;
  const baseFreq = 55 * scale; // low A-ish

  const osc1 = audioCtx.createOscillator();
  const osc2 = audioCtx.createOscillator();
  const osc3 = audioCtx.createOscillator();
  osc1.type = 'sawtooth';
  osc2.type = 'square';
  osc3.type = 'sine';
  osc1.frequency.value = baseFreq;
  osc2.frequency.value = baseFreq * 1.5;
  osc3.frequency.value = baseFreq * 0.5;

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 280;
  filter.Q.value = 0.7;

  padGain = audioCtx.createGain();
  padGain.gain.value = 0.0;

  const dist = audioCtx.createWaveShaper();
  dist.curve = makeDistortionCurve(28);

  osc1.connect(filter);
  osc2.connect(filter);
  osc3.connect(filter);
  filter.connect(dist);
  dist.connect(padGain);
  padGain.connect(masterGain);

  merger.connect(masterGain);

  binauralLeft.start();
  binauralRight.start();
  osc1.start();
  osc2.start();
  osc3.start();

  // Slow breathing of the field
  const now = audioCtx.currentTime;
  padGain.gain.setValueAtTime(0, now);
  padGain.gain.linearRampToValueAtTime(0.18, now + 4);
  masterGain.gain.linearRampToValueAtTime(0.7, now + 2.5);
}

function makeDistortionCurve(amount) {
  const n = 44100;
  const curve = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const x = (i * 2) / n - 1;
    curve[i] = ((Math.PI + amount) * x) / (Math.PI + amount * Math.abs(x));
  }
  return curve;
}

function playCough() {
  // Synthesized raw cough / throat clear
  const bufferSize = audioCtx.sampleRate * 0.6;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    const t = i / audioCtx.sampleRate;
    const env = Math.exp(-t * 8) * (t < 0.15 ? 1 : 0.4);
    data[i] = (Math.random() * 2 - 1) * env * 0.9;
  }
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 900;
  filter.Q.value = 0.8;
  const g = audioCtx.createGain();
  g.gain.value = 0.7;
  noise.connect(filter);
  filter.connect(g);
  g.connect(masterGain);
  noise.start();
}

// ============================================================
// VISUALS — Midnight lot + φ spirals + 42 Hz pulse
// ============================================================

function initParticles() {
  particles = [];
  for (let i = 0; i < 180; i++) {
    particles.push({
      x: Math.random() * width,
      y: Math.random() * height,
      r: Math.random() * 1.8 + 0.3,
      speed: Math.random() * 0.15 + 0.02,
      angle: Math.random() * Math.PI * 2,
      alpha: Math.random() * 0.4 + 0.1
    });
  }
  
  spirals = [];
  for (let s = 0; s < 5; s++) {
    spirals.push({
      arms: 1 + s % 2,
      scale: 40 + s * 55,
      rot: Math.random() * Math.PI * 2,
      speed: 0.0003 + s * 0.0001
    });
  }
}

function draw() {
  time += 0.016;
  
  // Dark gradient ground
  const grd = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, Math.max(width, height) * 0.8);
  grd.addColorStop(0, '#0c0b09');
  grd.addColorStop(0.5, '#080706');
  grd.addColorStop(1, '#030302');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, width, height);
  
  // Subtle dirt texture feel
  ctx.fillStyle = 'rgba(30,25,18,0.15)';
  for (let i = 0; i < 40; i++) {
    const x = (Math.sin(i * 12.3 + time * 0.1) * 0.5 + 0.5) * width;
    const y = (Math.cos(i * 7.7 + time * 0.07) * 0.5 + 0.5) * height;
    ctx.beginPath();
    ctx.arc(x, y, Math.random() * 2, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // Golden-ratio spirals (the generative ground of the lot)
  ctx.save();
  ctx.translate(centerX, centerY);
  spirals.forEach((s, idx) => {
    s.rot += s.speed;
    ctx.rotate(s.rot);
    ctx.beginPath();
    ctx.strokeStyle = `rgba(180, 160, 120, ${0.04 + idx * 0.015})`;
    ctx.lineWidth = 1;
    for (let i = 0; i < 180; i++) {
      const theta = i * 0.15;
      const r = s.scale * Math.pow(PHI, theta / (Math.PI * 2));
      const x = Math.cos(theta) * r * 0.15;
      const y = Math.sin(theta) * r * 0.15;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  });
  ctx.restore();
  
  // Soft radial suggestion of 13 shells as corners of the same lot
  for (let i = 0; i < 13; i++) {
    const angle = (i / 13) * Math.PI * 2 + time * 0.02;
    const dist = Math.min(width, height) * 0.38;
    const x = centerX + Math.cos(angle) * dist;
    const y = centerY + Math.sin(angle) * dist;
    const pulse = 0.5 + 0.5 * Math.sin(time * 2.2 + i); // subharmonic of 42-ish feel
    ctx.beginPath();
    ctx.arc(x, y, 3 + pulse * 2, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(160, 140, 100, ${0.08 + pulse * 0.06})`;
    ctx.fill();
  }
  
  // Particles
  particles.forEach(p => {
    p.x += Math.cos(p.angle) * p.speed;
    p.y += Math.sin(p.angle) * p.speed;
    if (p.x < 0) p.x = width;
    if (p.x > width) p.x = 0;
    if (p.y < 0) p.y = height;
    if (p.y > height) p.y = 0;
    
    const pulse = 0.6 + 0.4 * Math.sin(time * 6.5 + p.x * 0.01); // visual nod to 42-ish rhythm
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * pulse, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(200, 180, 140, ${p.alpha * pulse})`;
    ctx.fill();
  });
  
  // Z=0 center glow
  const zPulse = 0.5 + 0.5 * Math.sin(time * 1.8);
  const zg = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 120);
  zg.addColorStop(0, `rgba(180, 150, 100, ${0.12 * zPulse})`);
  zg.addColorStop(1, 'transparent');
  ctx.fillStyle = zg;
  ctx.fillRect(0, 0, width, height);
  
  requestAnimationFrame(draw);
}

// ============================================================
// SEQUENCE
// ============================================================

function showLine(text, className = '', delay = 0) {
  return new Promise(resolve => {
    setTimeout(() => {
      const div = document.createElement('div');
      div.className = 'line ' + className;
      div.textContent = text;
      sequence.appendChild(div);
      requestAnimationFrame(() => div.classList.add('visible'));
      resolve();
    }, delay);
  });
}

async function runSequence() {
  hint.classList.add('hidden');
  glass.classList.add('active');
  status.classList.add('visible');
  
  // Cough
  playCough();
  await new Promise(r => setTimeout(r, 900));
  playCough();
  await new Promise(r => setTimeout(r, 700));
  playCough();
  
  await new Promise(r => setTimeout(r, 1400));
  
  // Atmosphere is already rising from initAudio
  await showLine('ALRIGHT NOW', '', 0);
  await new Promise(r => setTimeout(r, 2200));
  
  await showLine('Every person is the master of their own reality.', 'core', 0);
  await showLine('They just have to remember.', 'core', 1800);
  
  await new Promise(r => setTimeout(r, 3500));
  
  await showLine('The lot is open.', 'small', 0);
  await showLine('No walls. No permission.', 'small', 1600);
  await showLine('Pure play.', 'small', 3200);
}

// ============================================================
// START
// ============================================================

function start() {
  if (started) return;
  started = true;
  
  initAudio();
  initParticles();
  draw();
  runSequence();
}

glass.addEventListener('click', start);
glass.addEventListener('touchstart', (e) => {
  e.preventDefault();
  start();
});

// Also allow space / enter
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Enter') start();
});

// Gentle auto-hint pulse
setInterval(() => {
  if (!started) {
    glass.style.boxShadow = `0 0 ${60 + Math.sin(Date.now()/400)*20}px rgba(100,140,180,0.2)`;
  }
}, 50);
</script>
</body>
</html>
